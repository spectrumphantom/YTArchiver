kind = "web"
previewPath = "/"
title = "YouTube Playlist Downloader"
version = "1.0.0"
id = "artifacts/playlist-downloader"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25843

[services.development]
run = "pnpm --filter @workspace/playlist-downloader run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/playlist-downloader", "run", "build" ]
publicDir = "artifacts/playlist-downloader/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25843"
BASE_PATH = "/"
