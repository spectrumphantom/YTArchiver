openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: YouTube Playlist Downloader API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: playlist
    description: Playlist scraping operations
  - name: songs
    description: Song management operations
  - name: downloads
    description: Download operations
  - name: Account
    description: Local application account linked to the authenticated Clerk session.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /playlist:
    delete:
      operationId: clearPlaylist
      tags: [playlist]
      summary: Clear the current playlist
      description: Stops any running download and removes the current playlist from the list. Downloaded audio files stay in storage.
      responses:
        "200":
          description: Playlist cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobStatus"
        "500":
          description: Playlist could not be cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /playlist/scrape:
    post:
      operationId: scrapePlaylist
      tags: [playlist]
      summary: Scrape all songs from a YouTube playlist
      description: Uses yt-dlp to extract all song metadata from a playlist URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistScrapeInput"
      responses:
        "200":
          description: Playlist scraped and songs saved to manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeResult"
        "400":
          description: Invalid playlist URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Scraping failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /songs:
    get:
      operationId: getSongs
      tags: [songs]
      summary: List songs in the manifest (paginated)
      description: Returns a page of songs tracked in the bucket manifest
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: sort
          in: query
          required: false
          description: Sort order for songs
          schema:
            type: string
            enum: [added, title, channel]
            default: added
      responses:
        "200":
          description: Paginated list of songs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongPage"

  /songs/download-all:
    get:
      operationId: downloadAllSongs
      tags: [songs]
      summary: Save all completed songs from the current playlist as a ZIP
      responses:
        "200":
          description: ZIP containing the completed playlist tracks
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: No completed songs are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /songs/{id}/download:
    get:
      operationId: downloadSong
      tags: [songs]
      summary: Download a song's audio file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audio file streamed as download
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Song not found or not yet downloaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /songs/stats:
    get:
      operationId: getSongStats
      tags: [songs]
      summary: Get download stats
      description: Returns counts of total, downloaded, and pending songs
      responses:
        "200":
          description: Song statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongStats"

  /songs/{id}:
    get:
      operationId: getSong
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Song preparation status and any rejection reason
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Song"
        "404":
          description: Song not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /downloads/start:
    post:
      operationId: startDownloads
      tags: [downloads]
      summary: Start downloading all pending songs
      description: Triggers background download of all songs not yet in the bucket
      responses:
        "200":
          description: Download job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobStatus"

  /downloads/song/{id}:
    post:
      operationId: startSongDownload
      tags: [downloads]
      summary: Download one song to the archive
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Song download started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobStatus"
        "404":
          description: Song not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another download is already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /downloads/status:
    get:
      operationId: getDownloadStatus
      tags: [downloads]
      summary: Get current download job status
      description: Returns whether a download is in progress and how many remain
      responses:
        "200":
          description: Current download status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobStatus"

  /downloads/pause:
    post:
      operationId: pauseDownloads
      tags: [downloads]
      summary: Pause downloads after the current song finishes
      responses:
        "200":
          description: Downloads pausing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobStatus"

  /downloads/stop:
    post:
      operationId: stopDownloads
      tags: [downloads]
      summary: Stop downloads immediately, aborting the current song
      responses:
        "200":
          description: Downloads stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobStatus"

  /me:
    get:
      tags: [Account]
      operationId: getAccount
      summary: Resolve the authenticated user's local application account
      responses:
        "200":
          description: Local account resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "401":
          description: Not signed in
        "403":
          description: Application identity unavailable

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PlaylistScrapeInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: YouTube playlist URL

    Song:
      type: object
      required:
        - id
        - title
        - channel
        - duration
        - status
        - addedAt
      properties:
        id:
          type: string
          description: YouTube video ID
        title:
          type: string
        channel:
          type: string
        duration:
          type: integer
          description: Duration in seconds
        thumbnailUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, downloading, done, error]
        errorReason:
          type: ["string", "null"]
          description: User-readable explanation of a failed preparation
        errorDetails:
          type: ["string", "null"]
          description: Relevant diagnostic reported by YouTube or the downloader
        bucketPath:
          type: ["string", "null"]
          description: Path in bucket if downloaded
        addedAt:
          type: string
          description: ISO timestamp when song was added
        downloadedAt:
          type: ["string", "null"]
          description: ISO timestamp when download completed

    SongPage:
      type: object
      required:
        - songs
        - total
        - page
        - pageSize
        - totalPages
      properties:
        songs:
          type: array
          items:
            $ref: "#/components/schemas/Song"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    ScrapeResult:
      type: object
      required:
        - totalFound
        - newAdded
        - alreadyExists
        - playlistTitle
        - songs
      properties:
        totalFound:
          type: integer
        newAdded:
          type: integer
        alreadyExists:
          type: integer
        playlistTitle:
          type: string
        songs:
          type: array
          items:
            $ref: "#/components/schemas/Song"

    SongStats:
      type: object
      required:
        - total
        - downloaded
        - pending
        - downloading
        - error
      properties:
        total:
          type: integer
        downloaded:
          type: integer
        pending:
          type: integer
        downloading:
          type: integer
        error:
          type: integer

    DownloadJobStatus:
      type: object
      required:
        - running
        - state
        - pending
        - completed
        - failed
      properties:
        running:
          type: boolean
        state:
          type: string
          enum: [idle, running, paused]
        currentSong:
          type: ["string", "null"]
        pending:
          type: integer
        completed:
          type: integer
        failed:
          type: integer

    Account:
      type: object
      required: [id, createdAt]
      properties:
        id:
          type: string
        createdAt:
          type: string

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
