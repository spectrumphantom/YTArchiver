openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: YouTube Playlist Downloader API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: playlist
    description: Playlist scraping operations
  - name: songs
    description: Song management operations
  - name: downloads
    description: Download operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /playlist/scrape:
    post:
      operationId: scrapePlaylist
      tags: [playlist]
      summary: Scrape all songs from a YouTube playlist
      description: Uses yt-dlp to extract all song metadata from a playlist URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistScrapeInput"
      responses:
        "200":
          description: Playlist scraped and songs saved to manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScrapeResult"
        "400":
          description: Invalid playlist URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Scraping failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /songs:
    get:
      operationId: getSongs
      tags: [songs]
      summary: List songs in the manifest (paginated)
      description: Returns a page of songs tracked in the bucket manifest
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: sort
          in: query
          required: false
          description: Sort order for songs
          schema:
            type: string
            enum: [added, title, channel]
            default: added
      responses:
        "200":
          description: Paginated list of songs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongPage"

  /songs/{id}/download:
    get:
      operationId: downloadSong
      tags: [songs]
      summary: Download a song's audio file
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Audio file streamed as download
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Song not found or not yet downloaded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /songs/stats:
    get:
      operationId: getSongStats
      tags: [songs]
      summary: Get download stats
      description: Returns counts of total, downloaded, and pending songs
      responses:
        "200":
          description: Song statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SongStats"

  /downloads/start:
    post:
      operationId: startDownloads
      tags: [downloads]
      summary: Start downloading all pending songs
      description: Triggers background download of all songs not yet in the bucket
      responses:
        "200":
          description: Download job started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobStatus"

  /downloads/status:
    get:
      operationId: getDownloadStatus
      tags: [downloads]
      summary: Get current download job status
      description: Returns whether a download is in progress and how many remain
      responses:
        "200":
          description: Current download status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobStatus"

  /downloads/pause:
    post:
      operationId: pauseDownloads
      tags: [downloads]
      summary: Pause downloads after the current song finishes
      responses:
        "200":
          description: Downloads pausing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobStatus"

  /downloads/stop:
    post:
      operationId: stopDownloads
      tags: [downloads]
      summary: Stop downloads immediately, aborting the current song
      responses:
        "200":
          description: Downloads stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DownloadJobStatus"

  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the returnTo path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — Bearer <sid>.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    PlaylistScrapeInput:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: YouTube playlist URL

    Song:
      type: object
      required:
        - id
        - title
        - channel
        - duration
        - status
        - addedAt
      properties:
        id:
          type: string
          description: YouTube video ID
        title:
          type: string
        channel:
          type: string
        duration:
          type: integer
          description: Duration in seconds
        thumbnailUrl:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, downloading, done, error]
        bucketPath:
          type: ["string", "null"]
          description: Path in bucket if downloaded
        addedAt:
          type: string
          description: ISO timestamp when song was added
        downloadedAt:
          type: ["string", "null"]
          description: ISO timestamp when download completed

    SongPage:
      type: object
      required:
        - songs
        - total
        - page
        - pageSize
        - totalPages
      properties:
        songs:
          type: array
          items:
            $ref: "#/components/schemas/Song"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer

    ScrapeResult:
      type: object
      required:
        - totalFound
        - newAdded
        - alreadyExists
        - playlistTitle
        - songs
      properties:
        totalFound:
          type: integer
        newAdded:
          type: integer
        alreadyExists:
          type: integer
        playlistTitle:
          type: string
        songs:
          type: array
          items:
            $ref: "#/components/schemas/Song"

    SongStats:
      type: object
      required:
        - total
        - downloaded
        - pending
        - downloading
        - error
      properties:
        total:
          type: integer
        downloaded:
          type: integer
        pending:
          type: integer
        downloading:
          type: integer
        error:
          type: integer

    DownloadJobStatus:
      type: object
      required:
        - running
        - state
        - pending
        - completed
        - failed
      properties:
        running:
          type: boolean
        state:
          type: string
          enum: [idle, running, paused]
        currentSong:
          type: ["string", "null"]
        pending:
          type: integer
        completed:
          type: integer
        failed:
          type: integer

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
